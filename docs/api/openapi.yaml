openapi: 3.1.0
info:
  description: |-
    チャットアプリ「RaiseChat」の API。機能ごとの決まりは機能定義書（docs/functions）を見る。

    ## エラーの一覧

    エラーのときは `{"code", "message", "field"}` を返す。message は画面にそのまま出せる文、field があればその入力欄の下に出す。

    | code | HTTP ステータス | message |
    | --- | --- | --- |
    | USERNAME_INVALID | 400 | ユーザー ID は 3〜15 文字の半角英数字と「_」で入力してください。 |
    | USERNAME_TAKEN | 409 | このユーザー ID は使われています。 |
    | PASSWORD_INVALID | 400 | パスワードは英字と数字を含む 8〜64 文字の半角文字で入力してください。 |
    | DISPLAY_NAME_REQUIRED | 400 | 表示名を入力してください。 |
    | LOGIN_FAILED | 401 | ユーザー ID かパスワードが違います。 |
    | LOGIN_LOCKED | 423 | ログインに続けて失敗したため、15 分間ログインできません。 |
    | UNAUTHENTICATED | 401 | ログインの有効期限が切れました。もう一度ログインしてください。 |
    | TOKEN_EXPIRED | 401 | ログインの有効期限が切れました。もう一度ログインしてください。 |
    | REFRESH_FAILED | 401 | ログインの有効期限が切れました。もう一度ログインしてください。 |
    | AVATAR_INVALID | 400 | アバターに使えるのは 5MB までの JPEG・PNG・WebP の画像です。 |
    | AVATAR_TOO_LARGE | 413 | アバターに使えるのは 5MB までの JPEG・PNG・WebP の画像です。 |
    | WORKSPACE_NAME_REQUIRED | 400 | ワークスペースの名前を入力してください。 |
    | WORKSPACE_LIMIT | 409 | 作れるワークスペースは 10 個までです。 |
    | WORKSPACE_NOT_FOUND | 404 | このワークスペースは見つからないか、参加していません。 |
    | INVITE_INVALID | 410 | この招待リンクは期限切れか、取り消されています。招待した人に新しいリンクをもらってください。 |
    | INVITE_NOT_FOUND | 404 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | CONFIRM_NAME_MISMATCH | 400 | ワークスペースの名前が違います。 |
    | CANNOT_KICK_OWNER | 403 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | OWNER_CANNOT_LEAVE | 403 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | CONVERSATION_NOT_FOUND | 404 | このチャンネルは見つからないか、参加していません。 |
    | CHANNEL_NAME_INVALID | 400 | チャンネル名は空白を含まない 1〜80 文字で入力してください。 |
    | CHANNEL_NAME_TAKEN | 409 | この名前のチャンネルはすでにあります。 |
    | USER_NOT_FOUND | 404 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | PRIVATE_CHANNEL | 403 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | NOT_PRIVATE_CHANNEL | 403 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | CANNOT_LEAVE_GENERAL | 403 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | CANNOT_DELETE_GENERAL | 403 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | NOT_OWNER | 403 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | CANNOT_DM_SELF | 400 | 入力が正しくありません。 |
    | DM_PARTNER_LEFT | 403 | 相手がこのワークスペースにいないため、メッセージを送れません。 |
    | MESSAGE_EMPTY | 400 | メッセージを入力してください。 |
    | MESSAGE_TOO_LONG | 400 | メッセージは 4,000 文字までです。 |
    | NOT_CHANNEL_MEMBER | 403 | このチャンネルに参加すると、メッセージを送れます。 |
    | NOT_AUTHOR | 403 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | CANNOT_REPLY_TO_REPLY | 400 | 入力が正しくありません。 |
    | MESSAGE_NOT_FOUND | 404 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | TOO_MANY_ATTACHMENTS | 400 | 添付できるのは 1 通に 4 個までです。 |
    | ATTACHMENT_TYPE_INVALID | 400 | 添付できるのは、10MB までの画像（JPEG・PNG・GIF・WebP）と 100MB までの動画（MP4・WebM）です。 |
    | ATTACHMENT_TOO_LARGE | 413 | 添付できるのは、10MB までの画像（JPEG・PNG・GIF・WebP）と 100MB までの動画（MP4・WebM）です。 |
    | UPLOAD_NOT_FOUND_IN_STORAGE | 400 | ファイルをアップロードできませんでした。もう一度お試しください。 |
    | UPLOAD_NOT_FOUND | 404 | ファイルをアップロードできませんでした。もう一度お試しください。 |
    | EMOJI_INVALID | 400 | 入力が正しくありません。 |
    | REACTION_LIMIT | 409 | このメッセージにはこれ以上の種類のリアクションを付けられません。 |
    | MESSAGE_DELETED | 403 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | BAD_REQUEST | 400 | 入力が正しくありません。 |
    | FORBIDDEN | 403 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | NOT_FOUND | 404 | 見つかりません。 |
    | INTERNAL_ERROR | 500 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
  title: RaiseChat API
  version: "1"
servers:
- url: /
security:
- accessToken: []
paths:
  /api/auth/login:
    post:
      description: access_token・refresh_token の Cookie を返す。続けて失敗すると 15 分ロックする（423）
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      security: []
      summary: ログイン
      tags:
      - FN-01 ユーザー登録・ログイン
  /api/auth/logout:
    post:
      description: refresh_token を無効にし、Cookie を消す
      operationId: logout
      parameters:
      - in: cookie
        name: refresh_token
        required: false
        schema:
          type: string
      responses:
        "204":
          description: ログアウトした
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: ログアウト
      tags:
      - FN-01 ユーザー登録・ログイン
  /api/auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: ログインしている自分
      tags:
      - FN-01 ユーザー登録・ログイン
  /api/auth/refresh:
    post:
      description: refresh_token の Cookie で、access_token・refresh_token を取り直す
      operationId: refresh
      parameters:
      - in: cookie
        name: refresh_token
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
          description: 取り直した
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      security: []
      summary: JWT の取り直し
      tags:
      - FN-01 ユーザー登録・ログイン
  /api/auth/signup:
    post:
      description: 登録したらそのままログインし、access_token・refresh_token の Cookie を返す
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
          description: 登録した
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      security: []
      summary: ユーザー登録
      tags:
      - FN-01 ユーザー登録・ログイン
  /api/auth/username-availability:
    get:
      operationId: usernameAvailability
      parameters:
      - in: query
        name: username
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameAvailability"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      security: []
      summary: ユーザー ID が使えるか
      tags:
      - FN-01 ユーザー登録・ログイン
  /api/conversations/{conversationId}:
    delete:
      description: オーナーだけ、general 以外。メッセージなども一緒に消える
      operationId: delete_2
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: 削除した
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: チャンネルを削除する
      tags:
      - FN-06 チャンネル
    get:
      description: 見られないとき（入っていないワークスペース・プライベートチャンネルなど）は 404
      operationId: get_4
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 会話の詳細
      tags:
      - FN-06 チャンネル
  /api/conversations/{conversationId}/candidates:
    get:
      description: そのチャンネルにいないワークスペースのメンバーを表示名の順に 50 人まで。q は表示名かユーザー ID に含む文字
      operationId: candidates
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: プライベートチャンネルに招待できる人
      tags:
      - FN-06 チャンネル
  /api/conversations/{conversationId}/join:
    post:
      description: もう入っていれば何もしない。プライベートチャンネル・DM は 403
      operationId: join
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 公開チャンネルに参加する
      tags:
      - FN-06 チャンネル
  /api/conversations/{conversationId}/leave:
    post:
      description: general は 403。入っていなければ何もしない
      operationId: leave_1
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: 退出した
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: チャンネルから退出する
      tags:
      - FN-06 チャンネル
  /api/conversations/{conversationId}/members:
    get:
      description: 表示名の順に 50 人ずつ。q は表示名かユーザー ID に含む文字
      operationId: members
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 会話のメンバーの一覧
      tags:
      - FN-06 チャンネル
    post:
      description: 1 人でもワークスペースにいなければ 404 で誰も足さない。もう入っている人は飛ばし、足した人を返す
      operationId: invite
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: プライベートチャンネルに招待する
      tags:
      - FN-06 チャンネル
  /api/conversations/{conversationId}/mention-candidates:
    get:
      description: その会話を見られる人（自分を除く）のうち、表示名かユーザー ID に q（0〜30 文字）を含む人を、会話のメンバーを先にして
        8 人まで
      operationId: mentionCandidates
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MentionCandidate"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: メンションの候補
      tags:
      - FN-11 メンション
  /api/conversations/{conversationId}/messages:
    get:
      description: 親メッセージ（スレッドの返信でないもの）を古い順に返す。before（その ID より前）・after（その ID より後）・around（そのメッセージと前後
        25 件ずつ。スレッドの返信ならその親の前後。MS-14）のどれか、またはなし（最新）。limit は 1〜50（指定がなければ 50。around
        とは一緒に使えない）
      operationId: list_3
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: before
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: after
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: around
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 会話のメッセージの一覧
      tags:
      - FN-07 メッセージ
    post:
      description: 同じ clientId で 2 回送ったときは、2 つ目を追加せず 1 つ目を返す。添付があれば本文は空でもよい
      operationId: post
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageView"
          description: 送った
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: メッセージを送る
      tags:
      - FN-07 メッセージ
  /api/conversations/{conversationId}/read:
    post:
      description: 最後に読んだメッセージを進め（戻さない）、最後に開いた会話として記録する
      operationId: read
      parameters:
      - in: path
        name: conversationId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadRequest"
        required: true
      responses:
        "204":
          description: 記録した
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 会話を開いた・読んだ（FN-14）
      tags:
      - FN-06 チャンネル
  /api/conversations/{conversationId}/uploads:
    post:
