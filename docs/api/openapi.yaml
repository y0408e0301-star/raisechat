        hasMoreBefore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/MessageView"
        parent:
          $ref: "#/components/schemas/MessageView"
      required:
      - hasMoreAfter
      - hasMoreBefore
      - items
      - parent
    SignupRequest:
      type: object
      properties:
        displayName:
          type: string
          description: 前後の空白を除いて 1〜30 文字（A-4）
        password:
          type: string
          description: 8〜64 文字の半角文字で、英字と数字を 1 文字以上ずつ含む（A-3）
        username:
          type: string
          description: 前後の空白を除いて 3〜15 文字の半角英数字と「_」（A-2）
      required:
      - displayName
      - password
      - username
    StartDmRequest:
      type: object
      properties:
        username:
          type: string
          description: 相手のユーザー ID（大文字・小文字を区別しない）
      required:
      - username
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          description: 前後の空白を除いて 1〜30 文字
        statusEmoji:
          type: string
          description: 絵文字 1 つ。空か null でなし
        statusExpiresAt:
          type: string
          format: date-time
          description: ステータスを消す日時。今より後か、null（消さない）
        statusText:
          type: string
          description: 前後の空白を除いて 0〜100 文字。改行を含まない
      required:
      - displayName
    UploadTicket:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
        putUrl:
          type: string
        uploadId:
          type: integer
          format: int64
      required:
      - expiresAt
      - headers
      - putUrl
      - uploadId
    UserName:
      type: object
      properties:
        displayName:
          type: string
        username:
          type: string
      required:
      - displayName
      - username
    UserSummary:
      type: object
      properties:
        avatarUrl:
          type:
          - string
          - "null"
        displayName:
          type: string
        statusEmoji:
          type:
          - string
          - "null"
        statusText:
          type:
          - string
          - "null"
        username:
          type: string
      required:
      - avatarUrl
      - displayName
      - statusEmoji
      - statusText
      - username
    UsernameAvailability:
      type: object
      properties:
        available:
          type: boolean
      required:
      - available
    WorkspaceDetail:
      type: object
      properties:
        generalConversationId:
          type: integer
          format: int64
        hasUnread:
          type: boolean
        id:
          type: integer
          format: int64
        lastOpenedConversationId:
          type:
          - integer
          - "null"
          format: int64
        memberCount:
          type: integer
          format: int64
        mentionCount:
          type: integer
          format: int32
        name:
          type: string
        owner:
          $ref: "#/components/schemas/UserSummary"
        role:
          type: string
          enum:
          - OWNER
          - MEMBER
      required:
      - generalConversationId
      - hasUnread
      - id
      - lastOpenedConversationId
      - memberCount
      - mentionCount
      - name
      - owner
      - role
    WorkspaceMemberPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemberView"
        memberCount:
          type: integer
          format: int64
        nextCursor:
          type:
          - string
          - "null"
      required:
      - items
      - memberCount
      - nextCursor
    WorkspaceSummary:
      type: object
      properties:
        hasUnread:
          type: boolean
        id:
          type: integer
          format: int64
        mentionCount:
          type: integer
          format: int32
        name:
          type: string
        role:
          type: string
          enum:
          - OWNER
          - MEMBER
      required:
      - hasUnread
      - id
      - mentionCount
      - name
      - role
  securitySchemes:
    accessToken:
      description: ログイン（POST /api/auth/login）で受け取る JWT の Cookie（機能定義書 3.2）。GET 以外では、Cookie
        の XSRF-TOKEN の値を X-XSRF-TOKEN ヘッダーで送り返す（CSRF 対策）
      in: cookie
      name: access_token
      type: apiKey
