          description: "前後の空白を除き、改行を LF にそろえて 1〜4,000 文字（FN-07 4 章）"
        clientId:
          type: string
          description: 画面が送信ごとに作る UUID。同じ送信を 2 回追加しないために使う
      required:
      - body
      - clientId
    ReadRequest:
      type: object
      properties:
        lastMessageId:
          type: integer
          format: int64
          description: 画面に出したいちばん新しい親メッセージの ID。メッセージがまだない会話では 0（FN-14 4 章）
      required:
      - lastMessageId
    SignupRequest:
      type: object
      properties:
        displayName:
          type: string
          description: 前後の空白を除いて 1〜30 文字（A-4）
        password:
          type: string
          description: 8〜64 文字の半角文字で、英字と数字を 1 文字以上ずつ含む（A-3）
        username:
          type: string
          description: 前後の空白を除いて 3〜15 文字の半角英数字と「_」（A-2）
      required:
      - displayName
      - password
      - username
    UserSummary:
      type: object
      properties:
        avatarUrl:
          type:
          - string
          - "null"
        displayName:
          type: string
        statusEmoji:
          type:
          - string
          - "null"
        statusText:
          type:
          - string
          - "null"
        username:
          type: string
      required:
      - avatarUrl
      - displayName
      - statusEmoji
      - statusText
      - username
    UsernameAvailability:
      type: object
      properties:
        available:
          type: boolean
      required:
      - available
    WorkspaceDetail:
      type: object
      properties:
        generalConversationId:
          type: integer
          format: int64
        hasUnread:
          type: boolean
        id:
          type: integer
          format: int64
        lastOpenedConversationId:
          type:
          - integer
          - "null"
          format: int64
        memberCount:
          type: integer
          format: int64
        mentionCount:
          type: integer
          format: int32
        name:
          type: string
        owner:
          $ref: "#/components/schemas/UserSummary"
        role:
          type: string
          enum:
          - OWNER
          - MEMBER
      required:
      - generalConversationId
      - hasUnread
      - id
      - lastOpenedConversationId
      - memberCount
      - mentionCount
      - name
      - owner
      - role
    WorkspaceMemberPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemberView"
        memberCount:
          type: integer
          format: int64
        nextCursor:
          type:
          - string
          - "null"
      required:
      - items
      - memberCount
      - nextCursor
    WorkspaceSummary:
      type: object
      properties:
        hasUnread:
          type: boolean
        id:
          type: integer
          format: int64
        mentionCount:
          type: integer
          format: int32
        name:
          type: string
        role:
          type: string
          enum:
          - OWNER
          - MEMBER
      required:
      - hasUnread
      - id
      - mentionCount
      - name
      - role
  securitySchemes:
    accessToken:
      description: ログイン（POST /api/auth/login）で受け取る JWT の Cookie（機能定義書 3.2）。GET 以外では、Cookie
        の XSRF-TOKEN の値を X-XSRF-TOKEN ヘッダーで送り返す（CSRF 対策）
      in: cookie
      name: access_token
      type: apiKey
