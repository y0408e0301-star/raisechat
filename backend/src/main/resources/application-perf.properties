# 性能テスト（開発計画書 2-2、基本設計書 2.4）を手元で動かすときの設定。
# jar を java -jar … --spring.profiles.active=perf で起動したときだけ使う（docs/guide/performance.md）。
# 開発用の DB を性能テストのデータ（ユーザー 1,000 人・メッセージ 50 万件など）で埋めないよう、
# 同じ PostgreSQL（compose.yaml の 5432）の中の別の DB raisechat_perf につなぐ。ポートは 8080 のまま変えない
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/raisechat_perf}
# 画面は jar（8080）が配るので、WebSocket の Origin も 8080 にする
app.web.origin=${WEB_ORIGIN:http://localhost:8080}
